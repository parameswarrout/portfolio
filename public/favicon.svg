<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background circle with dark glass-like fill and border gradient -->
  <circle cx="50" cy="50" r="46" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="6" />
  <!-- Center letter "P" -->
  <text x="46" y="62" text-anchor="middle" fill="url(#glowGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="56">P</text>
  <!-- Dot after the letter to match "Parameswar." branding -->
  <circle cx="70" cy="62" r="7" fill="#a855f7" />
</svg>
